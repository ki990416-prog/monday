<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 귤 뽑기</title>
  <style>
    :root {
      --sky-top: #bfe6f7;
      --sky-bottom: #f4fbff;
      --ink: #2b3a33;
      --orange: #ff9f1c;
      --orange-dark: #e8780a;
      --leaf: #3f9a52;
      --leaf-dark: #2c7a40;
      --card: #fffdf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: linear-gradient(var(--sky-top), var(--sky-bottom) 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
    }
    h1 { margin: 4px 0 2px; font-size: 1.7rem; }
    .sub { margin: 0 0 12px; font-size: .95rem; opacity: .75; }
    .counter {
      background: #fff;
      border-radius: 999px;
      padding: 6px 18px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .counter b { color: var(--orange-dark); font-size: 1.3rem; }

    .stage {
      position: relative;
      width: min(92vw, 400px);
      aspect-ratio: 1 / 1.05;
      margin-top: 10px;
    }
    .ground {
      position: absolute; left: -6%; right: -6%; bottom: 0; height: 12%;
      background: #8bc56a;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .tree {
      position: absolute; inset: 0;
      border: 0; padding: 0; background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .trunk {
      position: absolute; left: 44%; width: 12%; bottom: 8%; height: 34%;
      background: linear-gradient(90deg, #8a5a33, #a8733f 50%, #8a5a33);
      border-radius: 8px 8px 4px 4px;
    }
    .canopy {
      position: absolute; left: 6%; right: 6%; top: 2%; height: 64%;
      background:
        radial-gradient(circle at 30% 35%, var(--leaf) 0 28%, transparent 29%),
        radial-gradient(circle at 70% 35%, var(--leaf) 0 28%, transparent 29%),
        radial-gradient(circle at 50% 62%, var(--leaf-dark) 0 36%, transparent 37%),
        radial-gradient(circle at 50% 30%, var(--leaf) 0 32%, transparent 33%);
    }
    .tree:active .canopy, .tree.shake .canopy { animation: shake .4s; }
    .tree:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; border-radius: 16px; }
    @keyframes shake {
      0%,100% { transform: rotate(0); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    .fruit {
      position: absolute;
      width: 13%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffd166, var(--orange) 55%, var(--orange-dark));
      box-shadow: inset -3px -4px 6px rgba(0,0,0,.12);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .fruit::after {
      content: "";
      position: absolute; top: -9%; left: 40%;
      width: 28%; height: 20%;
      background: var(--leaf-dark);
      border-radius: 0 100% 0 100%;
    }
    .fruit.fall {
      transition: top .75s cubic-bezier(.5, 0, 1, .6), transform .75s ease-in;
      transform: translate(-50%, -50%) rotate(300deg);
    }
    .fruit.landed { width: 9%; }
    .fruit.grow { animation: grow .6s ease-out; }
    @keyframes grow { from { opacity: 0; scale: .2; } to { opacity: 1; scale: 1; } }

    .hint { margin: 6px 0 14px; font-size: .9rem; opacity: .7; }

    .card {
      width: min(92vw, 400px);
      min-height: 130px;
      background: var(--card);
      border: 2px dashed var(--orange);
      border-radius: 18px;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.1);
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
    }
    .card.pop { animation: pop .45s ease-out; }
    @keyframes pop {
      from { transform: scale(.85) translateY(10px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .jeju { font-size: 1.7rem; font-weight: 800; color: var(--orange-dark); }
    .mean { font-size: 1.05rem; }
    .empty { opacity: .6; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition-duration: .01s !important; }
    }
  </style>
</head>
<body>
  <h1>🍊 제주 귤 뽑기</h1>
  <p class="sub">귤나무를 눌러 제주어 덕담을 받아 보세요</p>
  <div class="counter">뽑은 귤 <b id="count">0</b>개</div>

  <div class="stage" id="stage">
    <div class="ground"></div>
    <button class="tree" id="tree" aria-label="귤나무를 눌러 귤 뽑기">
      <span class="trunk"></span>
      <span class="canopy"></span>
    </button>
  </div>
  <p class="hint">나무를 톡! 눌러 보세요</p>

  <div class="card" id="card" aria-live="polite">
    <div class="empty">아직 뽑은 귤이 없어요.<br>나무를 눌러 덕담 카드를 받아 보세요!</div>
  </div>

  <script>
    const WISHES = [
      ["혼저 옵서예", "어서 오세요"],
      ["폭삭 속았수다", "정말 수고하셨습니다"],
      ["하영 드십서", "많이 드세요"],
      ["복 하영 받읍서", "복 많이 받으세요"],
      ["고맙수다", "고맙습니다"],
      ["펜안히 갑서", "편안히 가세요"],
      ["오널도 좋은 날이우다", "오늘도 좋은 날입니다"],
      ["몸 튼튼허곡 마음 펜안헙서", "몸 튼튼하고 마음 편안하세요"]
    ];
    // 나무 위 귤 위치(%)
    const SPOTS = [
      [28, 22], [50, 14], [72, 22], [20, 40], [42, 34],
      [62, 38], [80, 42], [34, 52], [56, 54], [72, 56]
    ];

    const stage = document.getElementById("stage");
    const tree = document.getElementById("tree");
    const card = document.getElementById("card");
    const countEl = document.getElementById("count");
    let count = 0;
    let onTree = [];
    let landed = [];
    let regrowing = false;

    function growFruits() {
      landed.forEach(f => f.remove());
      landed = [];
      onTree = SPOTS.map(([x, y]) => {
        const f = document.createElement("div");
        f.className = "fruit grow";
        f.style.left = x + "%";
        f.style.top = y + "%";
        stage.appendChild(f);
        return f;
      });
      regrowing = false;
    }

    function showCard() {
      const [jeju, mean] = WISHES[Math.floor(Math.random() * WISHES.length)];
      card.innerHTML = "";
      const a = document.createElement("div");
      a.className = "jeju";
      a.textContent = jeju;
      const b = document.createElement("div");
      b.className = "mean";
      b.textContent = "(" + mean + ")";
      card.append(a, b);
      card.classList.remove("pop");
      void card.offsetWidth;
      card.classList.add("pop");
    }

    function pick() {
      if (regrowing || onTree.length === 0) return;
      tree.classList.remove("shake");
      void tree.offsetWidth;
      tree.classList.add("shake");

      const i = Math.floor(Math.random() * onTree.length);
      const fruit = onTree.splice(i, 1)[0];
      fruit.classList.remove("grow");
      void fruit.offsetWidth;
      fruit.classList.add("fall");
      fruit.style.top = "88%";
      fruit.style.left = (12 + Math.random() * 76) + "%";
      fruit.addEventListener("transitionend", () => {
        fruit.classList.add("landed");
      }, { once: true });
      landed.push(fruit);

      count++;
      countEl.textContent = count;
      showCard();

      if (onTree.length === 0) {
        regrowing = true;
        setTimeout(growFruits, 1800);
      }
    }

    tree.addEventListener("click", pick);
    growFruits();
  </script>
</body>
</html>
